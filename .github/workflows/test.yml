name: Verify plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . pytest
      - run: python -m pytest -q
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv build --wheel
      - name: Build standalone plugin and verify the extracted runtime
        shell: pwsh
        run: |
          uv python install cpython-3.13-windows-x86_64-none --install-dir .cache/runtime --no-bin --no-registry
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtimePath = (Get-ChildItem .cache/runtime -Directory -Filter 'cpython-3.13.*-windows-x86_64-none').FullName
          python scripts/package.py --windows-runtime $runtimePath
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_windows_package.py
      - name: Attach packages to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "Ya-Ma $GITHUB_REF_NAME" --notes "Почта для Codex с мастером подключения. Добавлены выгрузка вложений в Ya-Di по правилу, передача сроков в Ya-Cal и иконка Ya-Ma. В архиве windows-x64 есть Python и мастер connect.cmd."
