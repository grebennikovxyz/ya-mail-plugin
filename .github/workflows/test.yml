name: Verify plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate marketplace sources and versions
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python scripts/marketplaces.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/marketplaces.py
          fi
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - name: Exercise the phone setup form in Chromium and WebKit
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 8
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
          python scripts/check_mobile.py
      - run: python scripts/package.py
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: '24'
      - name: Preview both ClawHub publications without publisher credentials
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install --global --ignore-scripts clawhub@0.27.0
          python scripts/clawhub_release.py bundle
          python scripts/clawhub_release.py skill
      - name: Test and pack the n8n community node
        if: matrix.os == 'ubuntu-latest'
        working-directory: n8n
        run: |
          python scripts/export_catalog.py
          git diff --exit-code -- nodes/YaMa/catalog.json
          npm ci --ignore-scripts
          npm test
          python -m pip install trustme
          python ../scripts/check_n8n_gateway.py
          npm pack --pack-destination ../dist
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: integrations
          path: dist/*.tgz
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the release sources to be available in the public Git marketplaces
        shell: bash
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv build --wheel
      - name: Build standalone plugin and verify the extracted runtime
        shell: pwsh
        run: |
          uv python install cpython-3.13-windows-x86_64-none --install-dir .cache/runtime --no-bin --no-registry
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtimePath = (Get-ChildItem .cache/runtime -Directory -Filter 'cpython-3.13.*-windows-x86_64-none').FullName
          python scripts/package.py --windows-runtime $runtimePath
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_windows_package.py
      - uses: actions/download-artifact@v4
        with:
          name: integrations
          path: dist
      - name: Attach packages to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.whl *.zip *.tgz > SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" --json tagName > /dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease)')" = false
            gh release download "$GITHUB_REF_NAME" --dir published
            diff <(cd dist && ls -1) <(cd published && ls -1)
            (cd published && sha256sum --check --strict SHA256SUMS.txt)
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.zip dist/*.tgz dist/SHA256SUMS.txt --verify-tag --title "Ya-Ma $GITHUB_REF_NAME" --generate-notes
          fi
  marketplaces:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        channel: [bundle, skill]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global --ignore-scripts clawhub@0.27.0
      - name: Get the published release and check its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An old retry must never move the public latest tag backwards.
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$GITHUB_REF_NAME"
          asset="yandex-mail-${GITHUB_REF_NAME#v}-clawhub.tgz"
          gh release download "$GITHUB_REF_NAME" --dir dist --pattern "$asset" --pattern SHA256SUMS.txt
          (cd dist && awk -v file="$asset" '$2 == file {print; found++} END {if (found != 1) exit 1}' SHA256SUMS.txt | sha256sum --check --strict)
      - name: Publish the verified version
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: python scripts/clawhub_release.py ${{ matrix.channel }} --publish
